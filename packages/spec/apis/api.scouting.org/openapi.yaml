  /commissioners/v2/{personGuid}/contactHistory:
    get:
      tags: [Commissioners]
      operationId: getCommissionerContactHistory
      x-untested: Results depend on the signed-in account's positions and units
      summary: List a commissioner's contacts
      description: >-
        Returns one page of the contacts a commissioner made with units, in
        the years given, with counts by status. Without `year`, returns no
        contacts and leaves out the `totalNumberOf*` counts. A GUID that
        isn't a commissioner's returns no contacts. A `page` past the last
        returns the last page. Unknown query parameters are ignored.
      security:
        - bearer: []
      parameters:
        - name: personGuid
          in: path
          required: true
          description: >-
            The commissioner's person GUID, matched case-insensitively. Takes
            the `personGuid` of a contact.
          schema:
            $ref: "#/components/schemas/PersonGuid"
        - name: year
          in: query
          description: >-
            Calendar years of `contactDate` to include, separated by commas
          schema:
            type: string
            pattern: "^([0-9]{4})?((?<=[0-9]{4}),[0-9]{4})*$"
            examples: ["2024", "2023,2024"]
        - name: status
          in: query
          description: >-
            Contact status to include, matched case-insensitively. `all`, or
            leaving it out, includes every status.
          schema:
            type: string
            examples: [Complete, all]
        - name: sortBy
          in: query
          description: >-
            Sort order. `contactDate`, the default, `unitNumber`, and
            `overallScore` sort in descending order.
          schema:
            type: string
            enum: [contactDate, overallScore, unitNumber, unitType]
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: perPage
          in: query
          description: Contacts per page
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: A page of contacts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommissionerContactHistory"
              examples:
                withYear:
                  summary: With `year`
                  value:
                    numberOfContacts: 19
                    totalNumberOfCompletedContacts:
                      simpleAssessment: 19
                      detailedAssessment: 0
                    totalNumberOfInProgressContacts:
                      simpleAssessment: 0
                      detailedAssessment: 0
                    totalNumberOfScheduledContacts:
                      simpleAssessment: 0
                      detailedAssessment: 0
                    numberOfCompletedContacts: 19
                    numberOfInProgressContacts: 0
                    numberOfScheduledContacts: 0
                    numberOfContactsPerPage: 1
                    numberOfWithdrawnContacts: 0
                    startRecord: 1
                    endRecord: 1
                    contacts:
                      - contactGuid: 6A7B8C9D-0E1F-4A2B-9C3D-4E5F6A7B8C9D
                        contactDate: "2024-03-12"
                        createdDate: "2024-03-15"
                        completedDate: "2024-03-15"
                        lastUpdatedDate: ""
                        lastUpdatedPersonGuid: ""
                        statusChangeDate: "2024-03-15"
                        isExportedToJTE: false
                        organizationGuid: 3F2A1B4C-5D6E-4F70-8A9B-0C1D2E3F4A5B
                        otherTypeOfContact: ""
                        priorityNeeds: ""
                        contactComments: >-
                          Visited a troop meeting. The patrols were
                          planning their next campout.
                        contactType: UnitContact
                        status: Complete
                        typeOfContact: UnitActivity
                        contactAssessmentType: SimpleAssessment
                        overallScore: 4
                        simpleScore: 4
                        healthIndicators:
                          finance: 0
                          leadership: 0
                          program: 0
                          membership: 0
                        isServicePlanCreated: false
                        isUnitAssignedToCommissioner: false
                        unitHealthStatus: UnitHealthUnchanged
                        unitType: Troop
                        unitNumber: "1234"
                        unitTypeId: 2
                        unitFullName: Troop 1234 Example Community Church
                        charteredOrganization: Example Community Church
                withoutYear:
                  summary: Without `year`
                  value:
                    numberOfContacts: 0
                    numberOfCompletedContacts: 0
                    numberOfInProgressContacts: 0
