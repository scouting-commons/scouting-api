openapi: 3.1.0

info:
  title: Scouting America API
  version: 0.1.0
  description: >-
    Unofficial, community-maintained description of the public Scouting
    America API at api.scouting.org. Not affiliated with or endorsed by
    Scouting America. The MIT license applies to this description and repository only,
    not to the API or its data.


    Some list endpoints cache responses without regard to the query string.
    On those endpoints, send `Cache-Control: no-cache` or query filters may
    be ignored.
  contact:
    name: scouting-api on GitHub
    url: https://github.com/scouting-commons/scouting-api/issues
  license:
    name: MIT
    identifier: MIT

servers:
  - url: https://api.scouting.org
    description: Production

tags:
  - name: Advancement
    description: Ranks, merit badges, and other advancement
  - name: Commissioners
    description: Commissioner contacts with units, and their assessments
  - name: Lookups
    description: >-
      Reference lists, such as countries, states, positions, and swimming
      classifications
  - name: Organizations
    description: Units, districts, councils, and service territories

paths:
  /advancements/adventures:
    get:
      tags: [Advancement]
      operationId: listAdventures
      summary: List Cub Scout adventures
      description: >-
        Returns Cub Scout adventures, one item per requirements version. An
        adventure with several versions appears once per version, sharing `id`
        but with different `versionId`. Pass an adventure's `id` to the
        requirements endpoint to get its requirements. Filters combine with
        AND. A filter value that matches nothing returns an empty list.
        Unknown query parameters are ignored.
      security: []
      parameters:
        - $ref: "#/components/parameters/CacheControl"
        - name: status
          in: query
          description: >-
            `active` (the default) leaves out retired adventures, those with an
            `expiryDt`, and `all` includes them. Case-sensitive.
          schema:
            type: string
            enum: [active, all]
        - name: id
          in: query
          description: Return only versions of the adventure with this `id`
          schema:
            type: integer
            examples: [1]
        - name: rankId
          in: query
          description: Return only adventures for this rank
          schema:
            type: integer
            examples: [8]
        - name: version
          in: query
          description: Return only requirements versions from this year
          schema:
            type: integer
            examples: [2024]
        - name: versionId
          in: query
          description: Return only the requirements version with this `versionId`
          schema:
            type: integer
            examples: [285]
        - name: required
          in: query
          description: >-
            `true` returns only required adventures, and `false` only elective
            ones
          schema:
            type: boolean
      responses:
        "200":
          description: Matching adventure versions
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [adventures]
                properties:
                  adventures:
                    type: array
                    items:
                      $ref: "#/components/schemas/Adventure"
              example:
                adventures:
                  - id: 1
                    rankId: 8
                    rank: Tiger
                    name: My Tiger Jungle
                    nameShort: My Tiger Jungle
                    skuName: Cub Scout Tiger Core Adventure Loop - My Tiger Jungle
                    required: true
                    expiryDt: null
                    sortOrder: 1
                    image: null
                    sku: "619913"
                    price: 1.99
                    priceLastUpdated: "2026-09-16"
                    scoutNet: "1200"
                    bsaExternalUrlId: null
                    pageUrl: tiger-adventure-backyard-jungle.asp
                    searchKeywords: null
                    versionId: 98
                    version: 2016
                    header: null
                    footer: null
                    adminNotes: null
                    imageUrl100: https://d1kn0x9vzr5n76.cloudfront.net/images/adventures/1_100.png
                    imageUrl200: https://d1kn0x9vzr5n76.cloudfront.net/images/adventures/1_200.png
                    imageUrl300: https://d1kn0x9vzr5n76.cloudfront.net/images/adventures/1_300.png
        "400":
          $ref: "#/components/responses/InvalidQuery"

  /advancements/adventures/{adventureId}/requirements:
    get:
      tags: [Advancement]
      operationId: getAdventureRequirements
      summary: Get an adventure's requirements
      description: >-
        Returns one requirements version of an adventure: the newest by
        default, or the one given by `versionId`. Retired adventures work too.
        Requirements are a flat list; nest them using `parentRequirementId`
        and order them by `sortOrder`.
      security: []
      parameters:
        - $ref: "#/components/parameters/AdventureId"
        - name: versionId
          in: query
          description: >-
            A `versionId` of this adventure from the adventure list. Defaults to
            the newest version.
          schema:
            type: integer
            minimum: 1
            examples: [1]
      responses:
        "200":
          description: The requested requirements version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdventureRequirements"
              example:
                adventureId: 1
                rankId: 8
                rank: Tiger
                name: My Tiger Jungle
                nameShort: My Tiger Jungle
                skuName: Cub Scout Tiger Core Adventure Loop - My Tiger Jungle
                required: true
                sortOrder: 1
                sku: "619913"
                price: 1.99
                priceLastUpdated: "2026-09-16"
                scoutNet: "1200"
                bsaExternalUrlId: null
                pageUrl: tiger-adventure-backyard-jungle.asp
                searchKeywords: null
                versionId: 98
                version: 2016
                versionEffectiveDt: "2016-12-01"
                versionExpiryDt: "2024-08-31"
                header: null
                footer: null
                adminNotes: null
                image: null
                imageUrl100: https://d1kn0x9vzr5n76.cloudfront.net/images/adventures/1_100.png
                imageUrl200: https://d1kn0x9vzr5n76.cloudfront.net/images/adventures/1_200.png
                imageUrl300: https://d1kn0x9vzr5n76.cloudfront.net/images/adventures/1_300.png
                requirements:
                  - id: 848
                    versionId: 98
                    listNumber: null
                    number: null
                    name: Complete Requirement 1 plus at least two others.
                    nameShort: null
                    sortOrder: 1
                    footer: null
                    childrenRequired: 3
                    required: true
                    parentRequirementId: null
                    mappingId: null
                    newRequirementId: null
                    oldRequirementId1: null
                    oldRequirementId2: null
                  - id: 849
                    versionId: 98
                    listNumber: "1."
                    number: "1"
                    name: With your parent/guardian or other caring adult ..., go for a walk outside, ...
                    nameShort: Go for nature walk
                    sortOrder: 1.1
                    footer: null
                    childrenRequired: null
                    required: true
                    parentRequirementId: 848
                    mappingId: null
                    newRequirementId: null
                    oldRequirementId1: null
                    oldRequirementId2: null
        "400":
          description: "`adventureId` or `versionId` is invalid"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                errorCode: C400
                message: Bad Request
                errorDesc: Invalid request - "adventureId" must be larger than or equal to 1
        "404":
          description: >-
            No adventure exists with that ID, or `versionId` is not a version of
            this adventure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                errorCode: C404
                message: Not Found
                errorDesc: "Adventure not found for the given adventureId - adventureId: 999999"

  /advancements/awards:
    get:
      tags: [Advancement]
      operationId: listAwards
      summary: List awards
      description: >-
        Returns awards, such as knots, palms, and outdoor awards. Pass an
        award's `id` to the requirements endpoint to get its requirements.
        Filters combine with AND. Unknown query parameters are ignored.
      security: []
      parameters:
        - $ref: "#/components/parameters/CacheControl"
        - name: status
          in: query
          description: >-
            `active` (the default) returns awards without an `expiredDate`,
            `expired` returns those with one, and `all` returns both.
            Case-sensitive.
          schema:
            type: string
            enum: [active, expired, all]
        - name: programId
          in: query
          description: >-
            Return only awards whose `unitTypeId` is this value. Awards for all
            programs (empty `unitTypeId`) are left out.
          schema:
            type: string
            enum: ["1", "2", "3", "4", "5"]
      responses:
        "200":
          description: Matching awards
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [awards]
                properties:
                  awards:
                    type: array
                    items:
                      $ref: "#/components/schemas/Award"
              example:
                awards:
                  - id: "97"
                    name: 50-Miler Award
                    short: 50 Miler
                    category: ""
                    itemNumber: ""
                    rankId: ""
                    rank: ""
                    image: /images/awards/patches/50miler100.png
                    imageSmall: ""
                    sku: "191"
                    skuName: 50 Miler Award Emblem
                    price: "4.39"
                    priceLastupdated: "2026-09-16"
                    adultAward: "False"
                    adminNotes: ""
                    unitTypeId: "2"
                    program: Scouts BSA
                    unitType: Scouts BSA Troop
                    scoutNet: "605"
                    showOnEvents: "True"
                    showOnQuickEntry: "True"
                    activeDate: ""
                    expiredDate: ""
                    imageUrl100: https://d1kn0x9vzr5n76.cloudfront.net/images/awards/patches/50miler100.png
                    imageUrl200: https://d1kn0x9vzr5n76.cloudfront.net/images/awards/patches/50miler200.png
                    imageUrl300: https://d1kn0x9vzr5n76.cloudfront.net/images/awards/patches/50miler300.png
                    imageUrl400: https://d1kn0x9vzr5n76.cloudfront.net/images/awards/patches/50miler400.png
                    versions:
                      - awardVersionId: 5
                        version: "1911"
                        rankId: null
                        rank: null
                        expiredDate: null
                        versionEffectiveDt: "1911-01-01"
                        versionExpiryDt: null
                        image: /images/awards/patches/50miler100.png
        "400":
          $ref: "#/components/responses/InvalidQuery"

  /advancements/awards/{awardId}:
    get:
      tags: [Advancement]
      operationId: getAward
      summary: Get an award
      description: >-
        Returns one award from the award list, with a few fields that differ
        from the list: `priceLastUpdated` replaces `priceLastupdated`,
        `program` is absent, `image` is a bare file name, and empty values are
        often `null`. An ID that isn't in the award list returns `200` with
        `name` and most other fields `null`, not `404`.
      security: []
      parameters:
        - $ref: "#/components/parameters/AwardId"
      responses:
        "200":
          description: >-
            The award, or a placeholder with `null` fields if no award in the
            list has this ID
          content:
            application/json:
              schema:
                type: object
                anyOf:
                  - $ref: "#/components/schemas/AwardDetail"
                  - $ref: "#/components/schemas/MissingAward"
              example:
                id: "97"
                name: 50-Miler Award
                short: 50 Miler
                category: ""
                itemNumber: ""
                rankId: ""
                rank: ""
                image: 50miler100.png
                imageSmall: ""
                sku: "191"
                skuName: 50 Miler Award Emblem
                price: "4.39"
                priceLastUpdated: "2026-09-16"
                adultAward: "False"
                adminNotes: ""
                unitTypeId: "2"
                unitType: Scouts BSA Troop
                scoutNet: "605"
                showOnEvents: "True"
                showOnQuickEntry: "True"
                activeDate: null
                expiredDate: null
                imageUrl100: https://d1kn0x9vzr5n76.cloudfront.net/images/awards/patches/50miler100.png
                imageUrl200: https://d1kn0x9vzr5n76.cloudfront.net/images/awards/patches/50miler200.png
                imageUrl300: https://d1kn0x9vzr5n76.cloudfront.net/images/awards/patches/50miler300.png
                imageUrl400: https://d1kn0x9vzr5n76.cloudfront.net/images/awards/patches/50miler400.png
                versions:
                  - awardVersionId: 5
                    version: "1911"
                    rankId: null
                    rank: null
                    expiredDate: null
                    versionEffectiveDt: "1911-01-01"
                    versionExpiryDt: null
                    image: /images/awards/patches/50miler100.png

  /advancements/awards/{awardId}/requirements:
    get:
      tags: [Advancement]
      operationId: getAwardRequirements
      summary: Get an award's requirements
      description: >-
        Returns one requirements version of an award: the newest by default,
        or the one given by `versionId`. Requirements are a flat list; nest
        them using `parentRequirementId` and order them by `sortOrder`. Many
        awards have no requirements. Some IDs that aren't in the award list
        also return `200`, with an empty version and no requirements.
      security: []
      parameters:
        - $ref: "#/components/parameters/AwardId"
        - name: versionId
          in: query
          description: >-
            An `awardVersionId` of this award from its `versions`. Defaults to
            the newest version. When given, the response has numbers and
            booleans in place of numeric and `True`/`False` strings (see
            `AwardVersionRequirements`).
          schema:
            type: integer
            minimum: 1
            examples: [337]
      responses:
        "200":
          description: >-
            The requested requirements version. Its shape depends on whether
            `versionId` was given.
          content:
            application/json:
              schema:
                type: object
                anyOf:
                  - $ref: "#/components/schemas/AwardRequirements"
                  - $ref: "#/components/schemas/AwardVersionRequirements"
              example:
                awardId: "97"
                awardName: 50-Miler Award
                awardVersionId: 5
                version: "1911"
                versionExpiredDate: ""
                versionEffectiveDt: "1911-01-01"
                versionExpiryDt: ""
                versionImage: /images/awards/patches/50miler100.png
                image: /images/awards/patches/50miler100.png
                imageUrl100: https://d1kn0x9vzr5n76.cloudfront.net/images/awards/patches/50miler100.png
                imageUrl200: https://d1kn0x9vzr5n76.cloudfront.net/images/awards/patches/50miler200.png
                imageUrl300: https://d1kn0x9vzr5n76.cloudfront.net/images/awards/patches/50miler300.png
                imageUrl400: https://d1kn0x9vzr5n76.cloudfront.net/images/awards/patches/50miler400.png
                requirements:
                  - id: "704"
                    number: ""
                    name: The 50-Miler Award is presented to each qualifying individual for ...
                    listNumber: ""
                    sortOrder: "0.5"
                    footer: ""
                    childrenRequired: ""
                    required: "False"
                    parentRequirementId: ""
                    totalMBRequired: ""
                    linkedAdventureRequirementId: ""
                    linkedAdventureId: ""
                    linkedMeritBadgeId: ""
                  - id: "705"
                    number: ""
                    name: Make complete and satisfactory plans for the trip, ...
                    listNumber: "1."
                    sortOrder: "1"
                    footer: ""
                    childrenRequired: ""
                    required: "True"
                    parentRequirementId: ""
                    totalMBRequired: ""
                    linkedAdventureRequirementId: ""
                    linkedAdventureId: ""
                    linkedMeritBadgeId: ""
        "400":
          description: "`awardId` or `versionId` is invalid"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                errorCode: C400
                message: Bad Request
                errorDesc: Invalid request - "awardId" must be larger than or equal to 1
        "404":
          description: >-
            No award exists with that ID, or `versionId` is not a version of
            this award
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                errorCode: C404
                message: Not Found
                errorDesc: "Unable to find the award for the given awardId. - awardId: 999999"

  /advancements/meritBadges:
    get:
      tags: [Advancement]
      operationId: listMeritBadges
      summary: List merit badges
      description: >-
        Returns merit badges. Pass a badge's `id` to the requirements endpoint
        to get its requirements. Filters combine with AND. A filter value that
        matches nothing returns an empty list.
      security: []
      parameters:
        - $ref: "#/components/parameters/CacheControl"
        - name: id
          in: query
          description: Return only the merit badge with this `id`
          schema:
            type: string
            examples: ["3"]
        - name: version
          in: query
          description: >-
            Return only requirements versions from this year. Badges with no
            matching version are left out.
          schema:
            type: string
            examples: ["2019"]
        - name: status
          in: query
          description: >-
            Which requirements versions to put in `versions`. `active` (the
            default) gives each badge's current version and leaves out
            discontinued badges. `inactive` gives past versions, including those
            of discontinued badges, and leaves out badges with none.
            Case-sensitive.
          schema:
            type: string
            enum: [active, inactive]
      responses:
        "200":
          description: Matching merit badges
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [meritBadges]
                properties:
                  meritBadges:
                    type: array
                    items:
                      $ref: "#/components/schemas/MeritBadge"
              example:
                meritBadges:
                  - id: "3"
                    categoryId: "3"
                    category: Business and Industry
                    bsaNumber: "15"
                    name: American Business
                    shortName: Amer. Business
                    description: ""
                    image: 15_150.png
                    eagleRequired: "False"
                    centennial: "False"
                    dateCreated: ""
                    dateDiscontinued: ""
                    lastUpdated: "2014-08-20"
                    adminNotes: ""
                    worksheetDOC: ""
                    worksheetPDF: http://meritbadge.org/wiki/images/7/70/American_Business.pdf
                    bsaPamphletNumber: "35850"
                    bsaPamphletEdition: "2002"
                    bsaPamphletImage: 3.jpg
                    bsaEmblemNumber: ""
                    bsaEmblemImage: ""
                    bsaRequirements: http://www.scouting.org/scoutsource/BoyScouts/AdvancementandAwards/MeritBadges/mb-ABIZ.aspx
                    pageURL: american-business-merit-badge-requirements.asp
                    searchKeywords: American Business Merit Badge Requirements
                    sku: "659930"
                    price: "3.99"
                    priceLastUpdated: "2026-09-16"
                    imageUrl50: https://d1kn0x9vzr5n76.cloudfront.net/images/meritbadges/3_50.png
                    imageUrl100: https://d1kn0x9vzr5n76.cloudfront.net/images/meritbadges/3_100.png
                    imageUrl200: https://d1kn0x9vzr5n76.cloudfront.net/images/meritbadges/3_200.png
                    versions:
                      - versionId: "282"
                        version: "2019"
                        versionEffectiveDt: "2019-01-01"
                        versionExpiryDt: ""
                        expiredDate: ""
        "400":
          $ref: "#/components/responses/InvalidQuery"

  /advancements/meritBadges/{meritBadgeId}/requirements:
    get:
      tags: [Advancement]
      operationId: getMeritBadgeRequirements
      summary: Get a merit badge's requirements
      description: >-
        Returns the current requirements version for a merit badge.
        Requirements are a flat list; nest them using `parentRequirementId`
        and order them by `sortOrder`.
      security: []
      parameters:
        - $ref: "#/components/parameters/MeritBadgeId"
      responses:
        "200":
          description: The merit badge's current requirements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeritBadgeRequirements"
              example:
                meritBadgeId: "3"
                meritBadgeName: American Business
                version: "2019"
                versionId: "282"
                versionEffectiveDt: "2019-01-01"
                versionExpiryDt: ""
                eagleRequired: "False"
                imageUrl50: https://d1kn0x9vzr5n76.cloudfront.net/images/meritbadges/3_50.png
                imageUrl100: https://d1kn0x9vzr5n76.cloudfront.net/images/meritbadges/3_100.png
                imageUrl200: https://d1kn0x9vzr5n76.cloudfront.net/images/meritbadges/3_200.png
                requirements:
                  - id: "8386"
                    name: "Do the following:"
                    listNumber: "1."
                    requirementNumber: ""
                    sortOrder: "1"
                    childrenRequired: "5"
                    required: "False"
                    parentRequirementId: ""
                    daysRequired: ""
                    counselorApproval: "False"
                    footer: ""
                  - id: "8387"
                    name: Explain four features of the free enterprise system in the United States. ...
                    listNumber: (a)
                    requirementNumber: 1a
                    sortOrder: "1.1"
                    childrenRequired: ""
                    required: "True"
                    parentRequirementId: "8386"
                    daysRequired: ""
                    counselorApproval: "False"
                    footer: ""
        "404":
          description: No merit badge exists with that ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                errorCode: C404
                message: Not Found
                errorDesc: "Merit Badge not found, verify that the meritBadgeId belongs to an existent merit badge - meritBadgeId: 999999"

  /advancements/ranks:
    get:
      tags: [Advancement]
      operationId: listRanks
      summary: List ranks
      description: >-
        Returns ranks across all programs, one item per requirements version.
        A rank with several versions appears once per version, sharing `id`
        but with different `versionId`. Filters combine with AND. A filter
        value that matches nothing returns an empty list.
      security: []
      parameters:
        - $ref: "#/components/parameters/CacheControl"
        - name: id
          in: query
          description: Return only versions of the rank with this `id`
          schema:
            type: string
            examples: ["1"]
        - name: programId
          in: query
          description: Return only ranks in this program
          schema:
            type: string
            examples: ["2"]
        - name: version
          in: query
          description: Return only requirements versions from this year
          schema:
            type: string
            examples: ["2022"]
        - name: status
          in: query
          description: >-
            `active` returns the current requirements version of each rank
            (some ranks have two current versions). `inactive` returns all other
            versions. Case-sensitive.
          schema:
            type: string
            enum: [active, inactive]
      responses:
        "200":
          description: Matching rank versions
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ranks]
                properties:
                  ranks:
                    type: array
                    items:
                      $ref: "#/components/schemas/Rank"
              example:
                ranks:
                  - id: "20"
                    name: Discovery
                    short: Discovery
                    reallyShort: Discovery
                    level: "2"
                    image: discovery.png
                    programId: "4"
                    program: Venturing
                    searchKeywords: Venturer Rank Award Requirements
                    lds: "False"
                    sku: "620502"
                    price: "2.99"
                    priceLastUpdated: "2026-09-16"
                    scoutNet: RV12
                    versionId: "62"
                    version: "2020"
                    header: ""
                    footer: ""
                    adminNotes: ""
                    proofReadDate: ""
                    active: "True"
                    expiredDate: ""
                    disabledOnQuickEntry: "False"
                    imageUrl50: https://d1kn0x9vzr5n76.cloudfront.net/images/ranks/discovery50.png
                    imageUrl100: https://d1kn0x9vzr5n76.cloudfront.net/images/ranks/discovery100.png
                    imageUrl200: https://d1kn0x9vzr5n76.cloudfront.net/images/ranks/discovery200.png
                    imageUrl400: https://d1kn0x9vzr5n76.cloudfront.net/images/ranks/discovery400.png
        "400":
          $ref: "#/components/responses/InvalidQuery"

  /advancements/ranks/{rankId}:
    get:
      tags: [Advancement]
      operationId: getRank
      summary: Get a rank
      description: >-
        Returns every requirements version of one rank, active and inactive,
        as the same items the rank list returns. Query parameters are ignored.
        An ID that isn't in the rank list returns `400`, not `404`.
      security: []
      parameters:
        - $ref: "#/components/parameters/RankId"
      responses:
        "200":
          description: The rank's versions
          content:
            application/json:
              schema:
                type: array
                minItems: 1
                items:
                  $ref: "#/components/schemas/Rank"
              example:
                - id: "1"
                  name: Scout
                  short: Scout
                  reallyShort: Scout
                  level: "1"
                  image: scout.png
                  programId: "2"
                  program: Scouts BSA
                  searchKeywords: Boy Scout Scouting Scout Rank Award Requirements
                  lds: "True"
                  sku: "657432"
                  price: "3.29"
                  priceLastUpdated: "2026-09-16"
                  scoutNet: RN
                  versionId: "84"
                  version: "2022"
                  header: All requirements for the Scout rank must be completed as a member of a troop or as a Lone Scout. ...
                  footer: "<strong>NOTES:</strong> ..."
                  adminNotes: ""
                  proofReadDate: ""
                  active: "True"
                  expiredDate: ""
