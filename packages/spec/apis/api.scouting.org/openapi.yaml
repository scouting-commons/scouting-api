        imageUrl200:
          $ref: "#/components/schemas/OptionalUri"
        imageUrl300:
          $ref: "#/components/schemas/OptionalUri"
        imageUrl400:
          $ref: "#/components/schemas/OptionalUri"
        versions:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/AwardVersion"

