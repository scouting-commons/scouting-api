    Error:
      type: object
      additionalProperties: false
      required:
        - errorCode
        - message
        - errorDesc
      properties:
        errorCode:
          type: string
          examples: [M400]
        message:
          type: string
          examples: [Bad Request]
        errorDesc:
          type: string
          examples: [Query parameter id is not repeatable]

  parameters:
    AdventureId:
      name: adventureId
      in: path
      required: true
      description: Adventure `id` from the adventure list
      schema:
        type: integer
        minimum: 1
        examples: [1]

    AwardId:
      name: awardId
      in: path
      required: true
      description: Award `id` from the award list
      schema:
        type: integer
        minimum: 1
        examples: [97]

    CacheControl:
      name: Cache-Control
      in: header
      description: >-
        Send `no-cache` for query filters to take effect. Without it, the
        response may come from a cache that ignores the query string. Other
        values and `Pragma: no-cache` don't bypass the cache.
      schema:
        type: string
        examples: [no-cache]

    ContactGuid:
      name: contactGuid
      in: path
      required: true
      description: >-
        A contact's GUID, matched case-insensitively. Takes the `contactGuid`
        of a contact.
      schema:
        $ref: "#/components/schemas/ContactGuid"

    MeritBadgeId:
      name: meritBadgeId
      in: path
      required: true
      description: Merit badge `id` from the merit badge list (not `bsaNumber`)
      schema:
        type: integer
        minimum: 1
        examples: [3]

    RankId:
      name: rankId
      in: path
      required: true
      description: Rank `id` from the rank list
      schema:
        type: integer
        minimum: 1
        examples: [1]

    SeaScoutElectiveId:
      name: ssElectiveId
      in: path
      required: true
      description: "`ssElectiveId` from the Sea Scout elective list"
      schema:
        type: integer
        minimum: 1
        examples: [1]

  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: >-
        The `token` from signing in at auth.scouting.org. Commissioner
        endpoints require it. Other endpoints that accept it also work
        without it.

  responses:
    Unauthorized:
      description: The token is missing or invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            missing:
              summary: No token
              value:
                errorCode: M401
                message: Unauthorized
                errorDesc: Missing JWT Token
            invalid:
              summary: An invalid token
              value:
                errorCode: M401
                message: Unauthorized
                errorDesc: Invalid JWT Authorization

    InvalidQuery:
      description: >-
        A query parameter has an invalid value, is repeated, or (on some
        endpoints) is unknown. Parameter names and enum values are
        case-sensitive.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            errorCode: M400
            message: Bad Request
            errorDesc: Invalid value 'bogus' for query parameter status. bogus is not a valid enum value
