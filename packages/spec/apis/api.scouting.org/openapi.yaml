        - sortOrder
        - footer
        - childrenRequired
        - required
        - parentRequirementId
        - totalMBRequired
        - linkedAdventureRequirementId
        - linkedAdventureId
        - linkedMeritBadgeId
      properties:
        id:
          type: string
          examples: ["705"]
        number:
          type: string
        name:
          type: string
