  /advancements/v2/adventures:
    get:
      tags: [Advancement]
      operationId: listAdventuresV2
      summary: List Cub Scout adventures (v2)
      description: >-
        Returns Cub Scout adventures, one item per adventure, each with its
        requirements versions in `versions`. Pass an adventure's `id` and a
        `versionId` to the adventure requirements endpoint to get its
        requirements. Filters combine with AND. Unknown query parameters are
        ignored.
      security: []
      parameters:
        - name: status
          in: query
          description: >-
            `active` (the default) leaves out retired adventures, those with an
            `expiryDt`, and `all` includes them. Case-sensitive.
          schema:
            type: string
            enum: [active, all]
        - name: id
          in: query
          description: Return only the adventure with this `id`
          schema:
            type: integer
            examples: [4]
        - name: rankId
          in: query
          description: Return only adventures for this rank
          schema:
            type: integer
            examples: [8]
        - name: version
          in: query
          description: >-
            Return only requirements versions from this year. Adventures with no
            matching version stay in the list, with an empty `versions`.
          schema:
            type: integer
            examples: [2024]
        - name: versionId
          in: query
          description: >-
            Return only the adventure with this requirements version, with only
            that version in `versions`
          schema:
            type: integer
            examples: [305]
        - name: required
          in: query
          description: >-
            `true` returns only required adventures, and `false` only elective
            ones
          schema:
            type: boolean
      responses:
        "200":
          description: Matching adventures
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [adventures]
                properties:
                  adventures:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdventureV2"
              example:
                adventures:
                  - id: 1
                    rankId: 8
                    rank: Tiger
                    name: My Tiger Jungle
                    nameShort: My Tiger Jungle
                    skuName: Cub Scout Tiger Core Adventure Loop - My Tiger Jungle
                    required: true
                    expiryDt: null
                    sortOrder: 1
                    sku: "619913"
                    price: 1.99
                    priceLastUpdated: "2026-09-16"
                    scoutNet: "1200"
                    bsaExternalUrlId: null
                    pageUrl: tiger-adventure-backyard-jungle.asp
                    searchKeywords: null
                    imageUrl100: https://d1kn0x9vzr5n76.cloudfront.net/images/adventures/1_100.png
                    imageUrl200: https://d1kn0x9vzr5n76.cloudfront.net/images/adventures/1_200.png
                    imageUrl300: https://d1kn0x9vzr5n76.cloudfront.net/images/adventures/1_300.png
                    versions:
                      - versionId: 98
                        version: 2016
                        versionEffectiveDt: "2016-12-01"
                        versionExpiryDt: "2024-08-31"
                        isRequired: true
                        expiredDate: "2024-12-31"
                      - versionId: 1
                        version: 2015
                        versionEffectiveDt: "2015-06-01"
                        versionExpiryDt: "2016-11-30"
                        isRequired: true
                        expiredDate: "2016-11-30"
        "400":
          $ref: "#/components/responses/InvalidQuery"

