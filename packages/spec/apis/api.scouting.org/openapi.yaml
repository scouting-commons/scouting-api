  /lookups/address/countries:
    get:
      tags: [Lookups]
      operationId: listCountries
      summary: List countries
      description: >-
        Returns all countries as an array sorted by `short`.
        With `id`, returns that one country as an object instead of an array.
      security: []
      parameters:
        - name: id
          in: query
          description: >-
            Return only the country with this `id`, as a single object rather
            than an array
          schema:
            type: integer
            examples: [616]
      responses:
        "200":
          description: >-
            An array of every country, or a single country object when `id` is
            given
          content:
            application/json:
              schema:
                type: [array, object]
                anyOf:
                  - type: array
                    items:
                      $ref: "#/components/schemas/Country"
                  - $ref: "#/components/schemas/Country"
              example:
                - name: Africa
                  short: AB
                  id: "388"
                - name: Ascension Island
                  short: AC
                  id: "389"
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "404":
          description: No country exists with that `id`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                errorCode: M404
                message: Not Found
                errorDesc: Record is not found. id= 999999

