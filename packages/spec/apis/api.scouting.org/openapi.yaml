        "400":
          description: >-
            `personGuid` isn't a GUID, or a query parameter has an invalid
            value, including an empty `status`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                notGuid:
                  summary: Not a GUID
                  value:
                    errorCode: WP400
                    message: Bad Request
                    errorDesc: Invalid person GUID
                invalidYear:
                  summary: An invalid `year`
                  value:
                    errorCode: M400
                    message: Bad Request
                    errorDesc: >-
                      Invalid value 'abc' for query parameter year. string
                      [abc] does not match pattern
                      ^([0-9]{4})?((?<=[0-9]{4}),[0-9]{4})*$
                invalidStatus:
                  summary: An invalid `status`
                  value:
                    errorCode: M400
