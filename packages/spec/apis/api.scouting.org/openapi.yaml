                      addressLine3: ""
                      city: Ft. Snelling
                      state: MN
                      zip5: "55111"
                      zip4: ""
                      country: US
                      county: RAMSEY
                    primaryPhone:
                      countryCode: null
                      areaCode: "612"
                      prefix: "261"
                      lineNumber: "2300"
                      extension: null
                    unitMeetingInformation:
                      addressLine1: ""
                      addressLine2: ""
                      city: ""
                      zip5: ""
                      stateShort: ""
                      meetingLocation: ""
                      meetingTime: ""
                    advancementEligibility:
                      adventures: null
                      meritBadges: null
                      ranks: null
                      awards: null
                    unitForums: []
        "400":
          description: >-
            `organizationGuid` isn't a version 4 GUID. A well-formed GUID of
            another version, such as all zeros, returns `C400`. Most other values
            return `M400`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                otherVersion:
                  summary: A GUID that isn't version 4
                  value:
                    errorCode: C400
                    message: Bad Request
                    errorDesc: Invalid request - "organizationGuid" must be a valid GUID
                notGuid:
                  summary: Not a GUID
                  value:
                    errorCode: M400
                    message: Invalid Request
                    errorDesc: micro url \'notaguid\' is not valid
        "404":
          description: No organization has that GUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                errorCode: C404
                message: Not Found
                errorDesc: >-
                  Organization not found, verify that the organizationGUID
                  belongs to an existent organization - organizationGuid:
                  F45624D7-0998-41F5-86F6-26061D93324E

components:
  schemas:
    Adventure:
      type: object
      additionalProperties: false
      description: One requirements version of a Cub Scout adventure
      required:
        - id
        - rankId
        - rank
        - name
        - nameShort
        - skuName
        - required
        - expiryDt
        - sortOrder
        - image
        - sku
        - price
        - priceLastUpdated
        - scoutNet
        - bsaExternalUrlId
        - pageUrl
        - searchKeywords
        - versionId
        - version
        - header
        - footer
        - adminNotes
        - imageUrl100
        - imageUrl200
        - imageUrl300
      properties:
        id:
          $ref: "#/components/schemas/AdventureId"
        rankId:
          type: integer
          description: The adventure's rank, as a rank `id` from the rank list in number form
          examples: [8]
        rank:
          type: string
          description: Rank name for `rankId`
          examples: [Tiger]
        name:
          type: string
          description: Can differ between versions of the same adventure
          examples: [My Tiger Jungle]
        nameShort:
          type: string
          examples: [My Tiger Jungle]
        skuName:
          type: [string, "null"]
          examples: [Cub Scout Tiger Core Adventure Loop - My Tiger Jungle]
        required:
          type: boolean
          description: "`true` for a required adventure, `false` for an elective"
        expiryDt:
          type: [string, "null"]
          description: Date the adventure was retired, or `null`
          anyOf:
            - $ref: "#/components/schemas/StringDate"
            - type: "null"
          examples: ["2022-05-31"]
        sortOrder:
          type: integer
          description: Position among the rank's adventures
          examples: [1]
        image:
          type: [string, "null"]
          description: Image file name, or `null`
          examples: [4_305_adventure_TeamTiger.png]
        sku:
          type: [string, "null"]
          description: Scout Shop SKU, or `null`
          examples: ["619913"]
        price:
          type: number
          description: Price in USD. `0` when not sold.
          examples: [1.99]
        priceLastUpdated:
          type: [string, "null"]
          anyOf:
            - $ref: "#/components/schemas/StringDate"
            - type: "null"
        scoutNet:
          type: [string, "null"]
          examples: ["1200"]
        bsaExternalUrlId:
          type: "null"
        pageUrl:
          type: [string, "null"]
          examples: [tiger-adventure-backyard-jungle.asp]
        searchKeywords:
          type: "null"
        versionId:
          type: integer
          description: Unique per requirements version
          examples: [98]
        version:
          type: integer
          description: Requirements version year
          examples: [2016]
        header:
          type: "null"
        footer:
          type: "null"
        adminNotes:
          type: "null"
        imageUrl100:
          type: string
          format: uri
        imageUrl200:
          type: string
          format: uri
        imageUrl300:
          type: string
          format: uri

    AdventureRequirements:
      type: object
      additionalProperties: false
      description: >-
        An adventure, as of the returned requirements version, with its
        requirements. Fields match those of the same name in `Adventure`.
      required:
        - adventureId
        - rankId
        - rank
        - name
        - nameShort
        - skuName
        - required
        - sortOrder
        - sku
        - price
        - priceLastUpdated
        - scoutNet
        - bsaExternalUrlId
        - pageUrl
        - searchKeywords
        - versionId
        - version
        - versionEffectiveDt
        - versionExpiryDt
        - header
        - footer
        - adminNotes
        - image
        - imageUrl100
        - imageUrl200
        - imageUrl300
        - requirements
      properties:
        adventureId:
          $ref: "#/components/schemas/AdventureId"
        rankId:
          type: integer
          examples: [8]
        rank:
          type: string
        name:
          type: string
        nameShort:
          type: string
        skuName:
          type: [string, "null"]
        required:
          type: boolean
        sortOrder:
          type: integer
        sku:
          type: [string, "null"]
        price:
          type: number
        priceLastUpdated:
          type: [string, "null"]
          anyOf:
            - $ref: "#/components/schemas/StringDate"
            - type: "null"
        scoutNet:
          type: [string, "null"]
        bsaExternalUrlId:
          type: "null"
        pageUrl:
          type: [string, "null"]
        searchKeywords:
          type: "null"
        versionId:
          type: integer
          examples: [98]
        version:
          type: integer
          examples: [2016]
        versionEffectiveDt:
          $ref: "#/components/schemas/StringDate"
        versionExpiryDt:
          type: [string, "null"]
          description: Date the version stopped being current, or `null`
          anyOf:
            - $ref: "#/components/schemas/StringDate"
            - type: "null"
        header:
          type: "null"
        footer:
          type: "null"
        adminNotes:
          type: "null"
        image:
          type: [string, "null"]
        imageUrl100:
          type: string
          format: uri
        imageUrl200:
          type: string
          format: uri
        imageUrl300:
          type: string
          format: uri
        requirements:
          type: array
          items:
            $ref: "#/components/schemas/AdventureRequirement"

    AdventureRequirement:
      type: object
      additionalProperties: false
      required:
        - id
        - versionId
        - listNumber
        - number
        - name
        - nameShort
        - sortOrder
        - footer
        - childrenRequired
        - required
        - parentRequirementId
        - mappingId
        - newRequirementId
        - oldRequirementId1
        - oldRequirementId2
      properties:
        id:
          type: integer
          examples: [849]
        versionId:
          type: integer
          description: "`versionId` of the requirements version"
          examples: [98]
        listNumber:
          type: [string, "null"]
          description: Display label, e.g. `1.` or `1a`, or `null`
          examples: ["1."]
        number:
          type: [string, "null"]
          description: Short identifier, e.g. `1a`, or `null`
          examples: [1a]
        name:
          type: string
          description: Requirement text. Sometimes contains HTML.
        nameShort:
          type: [string, "null"]
          description: Short label, or `null`
          examples: [Go for nature walk]
        sortOrder:
          type: [number, "null"]
          description: Sort key, e.g. `1` for a parent and `1.1` for its first child, or `null`
          examples: [1, 1.1]
        footer:
          type: [string, "null"]
          description: Notes, or `null`
        childrenRequired:
          type: [integer, "null"]
          description: Number of child requirements that must be completed, or `null`
          examples: [3]
        required:
          type: boolean
        parentRequirementId:
          type: [integer, "null"]
          description: "`id` of the parent requirement, or `null` for top-level requirements"
          examples: [848]
        mappingId:
          type: "null"
        newRequirementId:
          type: "null"
        oldRequirementId1:
          type: "null"
        oldRequirementId2:
          type: "null"

    AdventureId:
      type: integer
      description: An `id` from the adventure list, shared by all versions of the adventure
      examples: [1]

    Award:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - short
        - category
        - itemNumber
        - rankId
        - rank
        - image
        - imageSmall
        - sku
        - skuName
        - price
        - priceLastupdated
        - adultAward
        - adminNotes
        - unitTypeId
        - program
        - unitType
        - scoutNet
        - showOnEvents
        - showOnQuickEntry
        - activeDate
        - expiredDate
        - imageUrl100
        - imageUrl200
        - imageUrl300
        - imageUrl400
        - versions
      properties:
        id:
          $ref: "#/components/schemas/AwardId"
        name:
          type: string
          examples: [50-Miler Award]
        short:
          type: string
          description: Shorter name
          examples: [50 Miler]
        category:
          type: string
          examples: [Knots, ""]
        itemNumber:
          type: string
        rankId:
          type: string
          description: The rank this award belongs to, or empty
          anyOf:
            - $ref: "#/components/schemas/RankId"
