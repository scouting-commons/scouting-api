  /lookups/advancements/youthLeadershipPositions:
    get:
      tags: [Lookups]
      operationId: listYouthLeadershipPositions
      summary: List youth leadership positions
      description: >-
        Returns youth leadership positions as an array sorted by `id`. These
        are a subset of the positions list, sharing its `id` values, but with
        native JSON types: numbers and booleans instead of strings, and `null`
        where the positions list has an empty string.
      security: []
      parameters:
        - name: unitTypeId
          in: query
          description: >-
            Return only positions for this unit type, with each position's
            `unitTypes` narrowed to that one entry. Must be a unit type `id`
            from the unit type list; one with no positions returns an empty
            list. Some positions that list the unit type are still left out,
            so results can differ from filtering the full list.
          schema:
            type: integer
            minimum: 1
            examples: [2]
      responses:
        "200":
          description: Matching youth leadership positions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/YouthLeadershipPosition"
              example:
                - id: 3
                  name: Senior Patrol Leader
                  minAge: null
                  maxAge: null
                  positionCode: null
                  isUnitPosition: true
                  isDistrictPosition: false
                  isCouncilPosition: false
                  isTerritoryPosition: false
                  isNationalPosition: false
                  akelaSkPositionCd: null
                  akelaPositionId: 501
                  isKey3: false
                  unitTypes:
                    - image: seniorpatrolleader200.png
                      unitTypeId: 2
        "400":
          description: >-
            `unitTypeId` is not an existing unit type ID (`C400`), or is
            repeated (`M400`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                errorCode: C400
                message: Bad Request
                errorDesc: >-
                  Invalid request - "unitTypeId" must be valid in lookup
                  "unittypes"

