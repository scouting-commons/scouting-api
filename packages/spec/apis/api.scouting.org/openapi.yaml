  /commissioners/v2/units/contacts/{contactGuid}/simpleAssessment:
    get:
      tags: [Commissioners]
      operationId: getSimpleAssessment
      x-untested: Results depend on the signed-in account's positions and units
      summary: Get a contact's simple assessment
      description: >-
        Returns the simple assessment of a contact: one score and the
        commissioner's comments. Query parameters are ignored.
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/ContactGuid"
      responses:
        "200":
          description: The simple assessment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleAssessment"
              example:
                unitGuid: 3F2A1B4C-5D6E-4F70-8A9B-0C1D2E3F4A5B
                memberId: 123456789
                recordSourceType: 1
                contactDate: "2024-03-12"
                createdDate: "2024-03-15"
                completedDate: "2024-03-15"
                lastUpdatedPersonGuid: ""
                lastUpdatedDate: ""
                statusChangeDate: "2024-03-15"
                status: Complete
                typeOfContact: UnitActivity
                otherTypeOfContact: ""
                unitHealthStatus: UnitHealthUnchanged
                assessmentDetails:
                  simpleScore: 4
                  comments: >-
                    Visited a troop meeting. The patrols were
                    planning their next campout.
        "400":
          description: >-
            `contactGuid` isn't a GUID, or no contact with a simple
            assessment has it. A contact with a detailed assessment, or no
            contact at all, returns `M400`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                notSimple:
                  summary: No simple assessment
                  value:
                    errorCode: M400
                    message: Invalid Request
                    errorDesc: Contact does not have simple assessment.
                notGuid:
                  summary: Not a GUID
                  value:
                    errorCode: WP400
                    message: Bad Request
                    errorDesc: Invalid contact GUID
        "401":
          $ref: "#/components/responses/Unauthorized"

