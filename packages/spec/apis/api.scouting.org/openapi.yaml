          description: Creation time as `YYYY-MM-DDThh:mm:ss`, with no time zone
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}$"
          examples: ["2001-10-05T15:50:43"]
        lastModifiedBy:
          type: string
          description: >-
            Username of the account that last changed the record, or an empty
            string if it was never changed
          examples: [PASOWNER, ""]
        lastModifiedDt:
          type: string
          description: >-
            Time of the last change as `YYYY-MM-DDThh:mm:ss`, with no time
            zone, or an empty string if it was never changed
          pattern: "^([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2})?$"
          examples: ["2017-10-04T10:20:12", ""]
        isDelete:
          type: "null"
        isYrEndExpire:
          type: boolean
        numSeasons:
          type: [integer, "null"]
          examples: [5, null]
        courseUri:
          type: [string, "null"]
          format: uri
          description: Link to the course, or `null`
          examples: [https://training.scouting.org/courses/H114, null]

    OrganizationGuid:
      type: string
      description: A version 4 GUID identifying an organization
      pattern: "^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-4[0-9A-Fa-f]{3}-[89ABab][0-9A-Fa-f]{3}-[0-9A-Fa-f]{12}$"
      examples: [2cb46226-b47b-4ef1-ab3e-51806fe91dfd]

    OrganizationGuidOrEmpty:
      type: string
      description: An organization GUID in upper case, or empty
      anyOf:
        - $ref: "#/components/schemas/OrganizationGuid"
        - type: string
          const: ""

    OrganizationProfile:
      type: object
      additionalProperties: false
      description: >-
        An organization's profile. `organizationType` says which kind it is,
        and most unit-only fields are `null` or empty on other kinds.
      required:
        - organizationGuid
        - id
        - nodeId
        - name
        - number
        - organizationFullName
        - sbOrganizationId
        - specialInterestTypeId
        - specialInterestTypeCode
        - specialInterestType
        - type
        - typeId
        - organizationTypeId
        - organizationType
        - councilStructureType
        - tinyUrl
        - isLDS
        - isCouncilPaid
        - tenure
        - unitedWayName
        - affiliateOrganizationGuid
        - affiliateName
        - isComingSoon
        - districtGuid
        - districtNumber
        - districtName
        - councilGuid
        - councilName
        - territoryGuid
        - territoryName
        - territoryNumber
        - acceptGender
        - unitTimeZoneCode
        - unitTimeZoneLastUpdated
        - lat
        - long
        - isUnitGrowthExecutivesFlag
        - charter
        - nonUnitOrgMembersExpireMonth
        - effectiveDt
        - expiryDt
        - webContact
        - key3
        - executiveOfficer
        - primaryAddress
        - primaryPhone
        - unitMeetingInformation
        - advancementEligibility
        - unitForums
      properties:
        organizationGuid:
          $ref: "#/components/schemas/OrganizationGuid"
          description: The requested GUID, in the case it was sent
        id:
          type: integer
          description: >-
            For units, the `legacyUnitId` in scoutconnect-api.scouting.org
          examples: [278147]
        nodeId:
          type: integer
          examples: [209798]
        name:
          type: string
          examples: [Troop 3346, Northern Star Council 250]
        number:
          type: string
          description: Unit, district, council, or territory number
          examples: ["3346", "04"]
        organizationFullName:
          type: string
          description: For units, `name` followed by the chartered organization's name
          examples: [Troop 3346 All Saints Lutheran Church]
        program:
          type: string
          description: The unit's program. Only units have it.
          examples:
            [Boy Scouting, Cub Scouting, Exploring, Sea Scouting, Venturing]
        sbOrganizationId:
          $ref: "#/components/schemas/IntegerOrEmpty"
          description: An integer for units, and empty for other organizations
          examples: [44384, ""]
        specialInterestTypeId:
          type: [integer, "null"]
          examples: [59, null]
        specialInterestTypeCode:
          type: string
          description: Empty when `specialInterestTypeId` is `null`
          examples: ["0413", ""]
        specialInterestType:
          type: string
          description: Empty when `specialInterestTypeId` is `null`
          examples: [TRADITIONAL PROGRAM, ""]
        type:
          type: string
          description: >-
            The unit type's `short` name in the organization unit type list.
            Empty for other organizations.
          examples: [Troop, ""]
        typeId:
          type: [integer, "null"]
          description: >-
            For units, an `id` from the organization unit type list, as an
            integer. `null` for other organizations.
          examples: [2, null]
        organizationTypeId:
          type: integer
          description: An `id` from the organization type list, as an integer
          examples: [6]
        organizationType:
          type: string
          description: >-
            `unit`, `council-entity` (a district), `council`, or
            `service-territory`
          examples: [unit, council-entity, council, service-territory]
        councilStructureType:
          type: string
          description: "`District` for districts, empty for other organizations"
          examples: [District, ""]
        tinyUrl:
          type: string
          format: uri
          description: Link to the organization's online registration page
          examples:
            [https://my.scouting.org/VES/OnlineReg/1.0.0/?tu=UF-MB-250taa3346]
        isLDS:
          type: boolean
        isCouncilPaid:
          type: boolean
        tenure:
          type: [integer, "null"]
          description: >-
            The unit's age in months, the same as `unitTenureMonths` in
            scoutconnect-api.scouting.org. `null` for other organizations.
          examples: [682, null]
        unitedWayName:
          type: [string, "null"]
          examples: [MINNEAPOLIS, null]
        affiliateOrganizationGuid:
          type: [string, "null"]
          description: >-
            Upper-case GUID, or `null`. Profiles return 404 for it.
          examples: [4CF806BA-B96F-4C45-838A-E73813091F35, null]
        affiliateName:
          type: [string, "null"]
          examples: [American Legion and Auxiliaries, null]
        isComingSoon:
          type: boolean
        districtGuid:
          $ref: "#/components/schemas/OrganizationGuidOrEmpty"
          description: >-
            The unit's district. Empty for districts, councils, and service
            territories.
        districtNumber:
          type: string
          examples: ["114", ""]
        districtName:
          type: string
          examples: [M, ""]
        councilGuid:
          $ref: "#/components/schemas/OrganizationGuidOrEmpty"
          description: >-
            The organization's council, or the council itself. Empty for
            service territories.
        councilName:
          type: string
          examples: [Northern Star Council, ""]
        territoryGuid:
          $ref: "#/components/schemas/OrganizationGuid"
          description: >-
            The organization's service territory, or the territory itself, in
            upper case
        territoryName:
          type: string
          examples: [Service Territory 04]
        territoryNumber:
          type: string
          examples: ["04"]
        acceptGender:
          type: [string, "null"]
          description: A code, `null` for many units and every other organization
          examples: [BT, FP, NA, null]
        unitTimeZoneCode:
          type: [string, "null"]
          description: >-
            IANA time zone name. Some aren't in the unit time zone list.
            `null` for other organizations.
          examples: [America/Chicago, null]
        unitTimeZoneLastUpdated:
          type: [string, "null"]
          description: Date and time as `YYYY-MM-DDThh:mm:ss`, with no time zone
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}$"
          examples: ["2020-11-17T15:34:35", null]
        lat:
          type: [number, "null"]
          description: Latitude. `null` for districts.
          examples: [44.903204, null]
        long:
          type: [number, "null"]
          description: Longitude. `null` for districts.
          examples: [-93.482351, null]
        isUnitGrowthExecutivesFlag:
          type: [boolean, "null"]
          description: "`null` for other organizations"
        charter:
          description: The unit's current charter. `null` for other organizations.
          anyOf:
            - $ref: "#/components/schemas/OrganizationCharter"
            - type: "null"
          type: [object, "null"]
        nonUnitOrgMembersExpireMonth:
          type: [integer, "null"]
          description: >-
            A month number. `null` for units and service territories.
          minimum: 1
          maximum: 12
          examples: [12, null]
        effectiveDt:
          $ref: "#/components/schemas/NullableDate"
          description: "`null` for units and service territories"
        expiryDt:
          $ref: "#/components/schemas/NullableDate"
        webContact:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationWebContact"
        key3:
          type: array
          description: >-
            The organization's key leaders. Without a valid token, always one
            entry with every value masked.
          items:
            $ref: "#/components/schemas/OrganizationKey3"
        executiveOfficer:
          $ref: "#/components/schemas/OrganizationExecutiveOfficer"
        primaryAddress:
          type: object
          additionalProperties: false
          description: Every value is empty for districts
          required:
            - addressLine1
            - addressLine2
            - addressLine3
            - city
            - state
            - zip5
            - zip4
            - country
            - county
          properties:
            addressLine1:
              type: string
              examples: [15915 Excelsior Blvd]
            addressLine2:
              type: string
              description: Can be empty or a single space
              examples: ["", " ", 2nd Flr]
            addressLine3:
              type: string
              examples: [""]
            city:
              type: string
              examples: [Minnetonka]
            state:
              type: string
              description: State abbreviation, or empty
              examples: [MN, ""]
            zip5:
              type: string
              pattern: "^([0-9]{5})?$"
              examples: ["55345", ""]
            zip4:
              type: string
              pattern: "^([0-9]{4})?$"
              examples: ["5628", ""]
            country:
              type: string
              examples: [US, ""]
            county:
              type: string
              examples: [Hennepin, ""]
        primaryPhone:
          type: object
          additionalProperties: false
          description: Every value is `null` for districts and service territories
          required: [countryCode, areaCode, prefix, lineNumber, extension]
          properties:
            countryCode:
              type: [string, "null"]
              examples: [US, null]
            areaCode:
              type: [string, "null"]
              examples: ["612", null]
            prefix:
              type: [string, "null"]
              examples: ["269", null]
            lineNumber:
              type: [string, "null"]
              examples: ["3382", null]
            extension:
              type: [string, "null"]
              examples: [null]
        unitMeetingInformation:
          type: object
          additionalProperties: false
          description: Where and when the unit meets. Every value is empty for other organizations.
          required:
            - addressLine1
            - addressLine2
            - city
            - zip5
            - stateShort
            - meetingLocation
            - meetingTime
          properties:
            addressLine1:
              type: string
              examples: [15915 Excelsior Blvd]
            addressLine2:
              type: string
              description: Can be empty or a single space
              examples: ["", Glen Lake Activity Center]
            city:
              type: string
              examples: [Minnetonka]
            zip5:
              type: string
              pattern: "^([0-9]{5})?$"
              examples: ["55345", ""]
            stateShort:
              type: string
              description: State abbreviation, or empty
              examples: [MN, ""]
            meetingLocation:
              type: string
              examples: [""]
            meetingTime:
              type: string
              description: Time as `hh:mm:ss`, or empty
              pattern: "^([0-9]{2}:[0-9]{2}:[0-9]{2})?$"
              examples: ["19:00:00", ""]
        advancementEligibility:
          type: object
          additionalProperties: false
          description: >-
            Which kinds of advancement the unit can record. Every value is
            `null` for Exploring units and other organizations.
          required: [adventures, meritBadges, ranks, awards]
          properties:
            adventures:
              type: [boolean, "null"]
            meritBadges:
              type: [boolean, "null"]
            ranks:
              type: [boolean, "null"]
            awards:
              type: [boolean, "null"]
        unitForums:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [discourseCategoryId, discourseCategorySlug]
            properties:
              discourseCategoryId:
                type: integer
                examples: [4080]
              discourseCategorySlug:
                type: string
                examples: [council-250-troop-3346-278147]

    OrganizationCharter:
      type: object
      additionalProperties: false
      required:
        - id
        - term
        - originalEffectiveDt
        - effectiveDate
        - expiryDate
        - communityOrganizationName
        - organizationGUID
        - skCommOrgTypeCD
        - fkCommOrgTypeId
        - programId
        - programName
        - isActive
        - isCurrentCharter
      properties:
        id:
          type: integer
          examples: [2994379]
        term:
          type: integer
          description: Length of the charter in months
          examples: [12]
        originalEffectiveDt:
          $ref: "#/components/schemas/NullableDate"
        effectiveDate:
          type: string
          format: date
          examples: ["2026-03-01"]
        expiryDate:
          type: string
          format: date
          examples: ["2027-02-28"]
        communityOrganizationName:
          type: string
          description: The chartered organization's name
          examples: [All Saints Lutheran Church]
        organizationGUID:
          type: string
          description: >-
            The chartered organization's GUID, in upper case. Profiles return
            404 for it.
          examples: [26CEF5AA-EB0E-488C-8CA0-BAD330A5B94E]
        skCommOrgTypeCD:
          type: integer
          description: The same as `fkCommOrgTypeId`
          examples: [25]
        fkCommOrgTypeId:
          type: integer
          examples: [25]
        programId:
          type: integer
          examples: [3]
        programName:
          type: string
          examples: [Scouts BSA, Cub Scouting]
        isActive:
          type: boolean
        isCurrentCharter:
          type: boolean

    OrganizationWebContact:
      type: object
      additionalProperties: false
      required: [id, contact, typeId, type, classificationId]
      properties:
        id:
          type: integer
          examples: [40635889]
        contact:
          type: [string, "null"]
          description: Can be `null`, and always is for phone entries
          examples: [http://www.troop346.org, null]
        typeId:
          type: integer
          description: The same as the profile's `organizationTypeId`
          examples: [6]
        type:
          type: string
          description: A `short` code from the communication type list
          examples: [URL, EMAL, FB]
        classificationId:
          type: integer
          description: >-
            An `id` from the communication classification list, as an
            integer, matching the communication type's `classificationId`
          examples: [2]

    OrganizationKey3:
      type: object
      additionalProperties: false
      description: A key leader. Every value is `***` without a valid token.
      required:
        [positionId, position, personFullName, firstName, lastName, suffix]
      properties:
        positionId:
          type: [integer, string]
          anyOf:
            - type: integer
            - $ref: "#/components/schemas/Masked"
          examples: [170248086, "***"]
        position:
          type: string
          examples: [Committee Chair, Scout Executive, "***"]
        personFullName:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        suffix:
          type: string

    OrganizationExecutiveOfficer:
      type: object
      additionalProperties: false
      description: >-
        The unit's executive officer. Without a valid token, every value is
        `***` and the full name is under the misspelled key
        `personFulllName`. With one, the full name is under `personFullName`,
        and other organizations and some units return an empty object.
      properties:
        personFullName:
          type: string
        personFulllName:
          $ref: "#/components/schemas/Masked"
        firstName:
          type: string
        middleName:
          type: string
        lastName:
          type: string
        suffix:
          type: string

    Masked:
      type: string
      description: A value hidden as `***`
      const: "***"

    NullableDate:
      type: [string, "null"]
      format: date
      examples: ["2005-07-01", null]

    MeritBadgeId:
      type: string
      description: An `id` from the merit badge list (not `bsaNumber`)
      pattern: "^[0-9]+$"
      examples: ["3"]

    RankId:
      type: string
      description: An `id` from the rank list, shared by all versions of the rank
      pattern: "^[0-9]+$"
      examples: ["20"]

    IntegerOrEmpty:
      type: [integer, string]
      anyOf:
        - type: integer
        - type: string
          const: ""

    OptionalUri:
      type: string
      description: A URL, or empty
      anyOf:
        - type: string
          format: uri
        - type: string
          const: ""

    StringBoolean:
      type: string
      enum: ["True", "False"]

    StringDate:
      type: string
      description: Date as `YYYY-MM-DD`, or an empty string if not set
      pattern: "^([0-9]{4}-[0-9]{2}-[0-9]{2})?$"

    StringDateTime:
      type: string
      description: >-
        Date and time as `YYYY-MM-DDThh:mm:ss`, with no time zone, or an empty
        string if not set
      pattern: "^([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2})?$"
      examples: ["2018-09-28T14:27:27"]

    ContactGuid:
      type: string
      description: >-
        A version 4 GUID identifying a commissioner contact, in upper case
      pattern: "^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-4[0-9A-Fa-f]{3}-[89ABab][0-9A-Fa-f]{3}-[0-9A-Fa-f]{12}$"
      examples: [6A7B8C9D-0E1F-4A2B-9C3D-4E5F6A7B8C9D]

    ContactGuidOrEmpty:
      type: string
      description: A contact GUID, or empty
      anyOf:
        - $ref: "#/components/schemas/ContactGuid"
        - type: string
          const: ""

    PersonGuid:
      type: string
      description: A version 4 GUID identifying a person, in upper case
      pattern: "^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-4[0-9A-Fa-f]{3}-[89ABab][0-9A-Fa-f]{3}-[0-9A-Fa-f]{12}$"
      examples: [5B1E2C3D-4F5A-4B6C-8D7E-9F0A1B2C3D4E]

    PersonGuidOrEmpty:
      type: string
      description: A person GUID, or empty
      anyOf:
        - $ref: "#/components/schemas/PersonGuid"
        - type: string
          const: ""

    ContactAssessmentType:
      type: string
      description: >-
        Which assessment the commissioner filled in, or empty when not set
      enum: [SimpleAssessment, DetailedAssessment, ""]

    ContactStatus:
      type: string
      description: Empty on some older contacts
      enum: [Complete, Withdrawn, ""]

    TypeOfContact:
      type: string
      description: >-
        Where the contact took place. `Other` has a description in
        `otherTypeOfContact`. Empty on some older contacts and when there's
        no contact.
      enum:
        - DistrictEvent
        - Other
        - SummerCamp
        - UnitActivity
        - UnitCommitteeOrLeaderMeeting
        - UnitKey3Meeting
        - UnitMeeting
        - UnitParentMeeting
        - ""

    UnitHealthStatus:
      type: string
      description: >-
        How the unit's health changed since the last contact, or empty on
        some older contacts
      enum: [UnitHealthImproved, UnitHealthUnchanged, UnitHealthDeclined, ""]

    HealthIndicators:
      type: object
      additionalProperties: false
      description: >-
        Area scores out of 5 from a detailed assessment. All `0` for a simple
        assessment.
      required: [finance, membership, program, leadership]
      properties:
        finance:
          type: number
          examples: [4]
        membership:
          type: number
          examples: [3.5]
        program:
          type: number
          examples: [4.2]
        leadership:
          type: number
          examples: [3.3]

    AssessmentTypeCounts:
      type: object
      additionalProperties: false
      required: [simpleAssessment, detailedAssessment]
      properties:
        simpleAssessment:
          type: integer
        detailedAssessment:
          type: integer

    UnitCommissionerContacts:
      type: object
      additionalProperties: false
      required:
        - unitID
        - unitGuid
        - unitFullName
        - unitType
        - unitNumber
        - charteredOrganization
        - lastCompletedContactDetails
        - contacts
      properties:
        unitID:
          type: integer
          description: The unit's `id` in its organization profile
          examples: [123456]
        unitGuid:
          $ref: "#/components/schemas/OrganizationGuid"
        unitFullName:
          type: string
          examples: [Troop 1234 Example Community Church]
        unitType:
          type: string
          description: The `short` name of the unit's type
          examples: [Troop]
        unitNumber:
          type: string
          examples: ["1234"]
        charteredOrganization:
          type: string
          examples: [Example Community Church]
        lastCompletedContactDetails:
          $ref: "#/components/schemas/LastCompletedContact"
        contacts:
          type: array
          items:
            $ref: "#/components/schemas/UnitCommissionerContact"

    LastCompletedContact:
      type: object
      additionalProperties: false
      description: >-
        The unit's most recent completed contact. With none, every string is
        empty and every score `0`.
      required:
        - contactGuid
        - contactDate
        - personWhoMadeContact
        - firstName
        - middleName
        - lastName
        - nameSuffix
        - overallScore
        - typeOfContact
        - otherTypeOfContact
        - assessmentType
        - isServicePlanCreated
        - healthIndicators
      properties:
        contactGuid:
          $ref: "#/components/schemas/ContactGuidOrEmpty"
        contactDate:
          $ref: "#/components/schemas/StringDate"
        personWhoMadeContact:
          type: string
          description: The commissioner's full name
          examples: [Pat Example]
        firstName:
          type: string
        middleName:
          type: string
        lastName:
          type: string
        nameSuffix:
          type: string
          examples: ["", III]
        overallScore:
          type: number
          description: Out of 5
          examples: [4]
        typeOfContact:
          $ref: "#/components/schemas/TypeOfContact"
        otherTypeOfContact:
          type: string
        assessmentType:
          $ref: "#/components/schemas/ContactAssessmentType"
        isServicePlanCreated:
          type: boolean
        healthIndicators:
          $ref: "#/components/schemas/HealthIndicators"

    UnitCommissionerContact:
      type: object
      additionalProperties: false
      required:
        - recordSourceType
        - contactGuid
        - contactDate
        - createdDate
        - completedDate
        - lastUpdatedDate
        - lastUpdatedPersonGuid
        - statusChangeDate
        - isExportedToJTE
        - typeOfContact
        - otherTypeOfContact
        - contactStatus
        - personWhoMadeContact
        - personPositionId
        - firstName
        - middleName
        - lastName
        - nameSuffix
        - overallScore
        - assessmentType
        - isServicePlanCreated
        - healthIndicators
      properties:
        recordSourceType:
          type: integer
          examples: [1]
        contactGuid:
          $ref: "#/components/schemas/ContactGuid"
        contactDate:
          type: string
          format: date
        createdDate:
          type: string
          format: date
        completedDate:
          $ref: "#/components/schemas/StringDate"
        lastUpdatedDate:
          $ref: "#/components/schemas/StringDate"
        lastUpdatedPersonGuid:
          $ref: "#/components/schemas/PersonGuidOrEmpty"
        statusChangeDate:
          $ref: "#/components/schemas/StringDate"
        isExportedToJTE:
          type: boolean
        typeOfContact:
          $ref: "#/components/schemas/TypeOfContact"
        otherTypeOfContact:
          type: string
        contactStatus:
          $ref: "#/components/schemas/ContactStatus"
        personWhoMadeContact:
          type: string
          description: The commissioner's full name
        personPositionId:
          type: "null"
        firstName:
          type: string
        middleName:
          type: string
        lastName:
          type: string
        nameSuffix:
          type: string
        overallScore:
          type: number
          description: Out of 5
        assessmentType:
          $ref: "#/components/schemas/ContactAssessmentType"
        isServicePlanCreated:
          type: boolean
        healthIndicators:
          $ref: "#/components/schemas/HealthIndicators"

    CommissionerContactHistory:
      type: object
      additionalProperties: false
      description: >-
        Counts cover every contact that matches `year` and `status`, across
        all pages
      required:
        - numberOfContacts
        - numberOfCompletedContacts
        - numberOfInProgressContacts
        - numberOfScheduledContacts
        - numberOfContactsPerPage
        - numberOfWithdrawnContacts
        - startRecord
        - endRecord
        - contacts
      properties:
        numberOfContacts:
