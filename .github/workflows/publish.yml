name: Publish

# Publishes each public package whose package.json version isn't on npm yet,
# so bumping a version on main releases it. Each release gets a GitHub release
# tagged <name>@<version>, such as scouting-api@0.5.0. Trusted publishing (OIDC)
# authenticates the upload, so there's no npm token.
on:
  push:
    branches: [main]

permissions:
  # To create GitHub releases
  contents: write
  id-token: write

# A second push waits for the first to finish publishing
concurrency:
  group: publish

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Uses the pnpm version from packageManager in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later, and npm 12 needs a newer
      # Node than .nvmrc
      - run: npm install -g npm@^11.5.1

      - run: pnpm install --frozen-lockfile

      # The client goes first: packing scouting-mcp sets its scouting-api
      # dependency to ^ the client's current version, which must be on npm.
      # Packing builds each package and replaces its workspace: versions.
      - name: Publish new versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for dir in packages/client-ts packages/mcp; do
            name=$(jq -r .name "$dir/package.json")
            tag="$name@$(jq -r .version "$dir/package.json")"
            if [ -n "$(npm view "$tag" version 2>/dev/null)" ]; then
              echo "$tag is already on npm"
              continue
            fi

            pnpm --filter "$name" pack --pack-destination "$RUNNER_TEMP/$name"
            npm publish "$RUNNER_TEMP/$name"/*.tgz --access public

            # Packing scouting-mcp also builds its .mcpb
            assets=()
            if [ "$name" = scouting-mcp ]; then
              assets=(packages/mcp/scouting-mcp.mcpb)
            fi

            # Release notes list the PRs since this package's last release
            previous=$(gh release list --json tagName | jq -r --arg prefix "$name@" '[.[].tagName | select(startswith($prefix))][0] // empty')
            gh release create "$tag" "${assets[@]}" \
              --target "$GITHUB_SHA" --title "$tag" --generate-notes \
              ${previous:+--notes-start-tag "$previous"}
          done
