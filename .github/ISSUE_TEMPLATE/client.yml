name: TypeScript client issue
description: Report a bug in, or request a change to, the typescript client package.
body:
  - type: markdown
    attributes:
      value: If the client returns data the spec doesn't describe correctly, use "Spec doesn't match the API" instead.

  - type: textarea
    id: description
    attributes:
      label: What happened, or what do you need?
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Code
      description: A minimal snippet that shows the issue. Leave out tokens and cookies.
      render: ts
